<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Willison's Blog - 日本語翻訳</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
      background: #f5f5f0;
      color: #333;
      line-height: 1.7;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; }
    header .subtitle { font-size: 0.85rem; opacity: 0.7; margin-top: 0.25rem; }

    .controls { display: flex; align-items: center; gap: 1rem; }

    #check-btn {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    #check-btn:hover { background: #c73652; }
    #check-btn:disabled { background: #666; cursor: not-allowed; }

    #status { font-size: 0.8rem; opacity: 0.8; min-width: 160px; text-align: right; }

    main { max-width: 860px; margin: 2rem auto; padding: 0 1.5rem; }

    .meta-bar { font-size: 0.8rem; color: #888; margin-bottom: 1.5rem; }

    .entry-list { display: flex; flex-direction: column; gap: 1.2rem; }

    .entry-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.4rem 1.6rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: box-shadow 0.2s;
    }

    .entry-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

    .entry-date { font-size: 0.75rem; color: #aaa; margin-bottom: 0.4rem; }

    .entry-title-ja { font-size: 1.15rem; font-weight: 700; color: #1a1a2e; margin-bottom: 0.3rem; }

    .entry-title-en { font-size: 0.8rem; color: #888; margin-bottom: 0.7rem; }

    .entry-summary {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1rem;
      border-left: 3px solid #e94560;
      padding-left: 0.8rem;
    }

    .entry-link {
      display: inline-block;
      font-size: 0.82rem;
      color: #e94560;
      text-decoration: none;
      font-weight: 600;
    }

    .entry-link:hover { text-decoration: underline; }

    .empty-state { text-align: center; padding: 4rem 2rem; color: #aaa; }
    .empty-state h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .empty-state p { font-size: 0.9rem; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1a1a2e;
      color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-size: 0.88rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Simon Willison's Blog</h1>
      <div class="subtitle">日本語翻訳 — Claude API による自動翻訳</div>
    </div>
    <div class="controls">
      <div id="status">読み込み中...</div>
      <button id="check-btn" onclick="triggerCheck()">今すぐチェック</button>
    </div>
  </header>

  <main>
    <div class="meta-bar" id="meta-bar"></div>
    <div class="entry-list" id="entry-list">
      <div class="empty-state"><h2>読み込み中...</h2></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    function formatDate(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleDateString('ja-JP', {
          year: 'numeric', month: 'long', day: 'numeric'
        });
      } catch { return iso; }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadTranslations() {
      try {
        const res = await fetch('/api/translations');
        const data = await res.json();
        render(data);
      } catch (err) {
        document.getElementById('entry-list').innerHTML =
          '<div class="empty-state"><h2>読み込みエラー</h2><p>' + escHtml(err.message) + '</p></div>';
      }
    }

    function render(data) {
      const metaBar = document.getElementById('meta-bar');
      const list = document.getElementById('entry-list');
      const status = document.getElementById('status');

      if (data.last_checked) {
        status.textContent = '最終確認: ' + formatDate(data.last_checked);
        metaBar.textContent = '翻訳済み記事: ' + (data.entries || []).length + '件';
      } else {
        status.textContent = '未チェック';
        metaBar.textContent = '';
      }

      if (!data.entries || data.entries.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <h2>翻訳済み記事はまだありません</h2>
            <p>「今すぐチェック」ボタンを押してブログを取得してください。<br>
            ※ ANTHROPIC_API_KEY 環境変数が必要です。</p>
          </div>`;
        return;
      }

      list.innerHTML = data.entries.map(e => `
        <div class="entry-card">
          <div class="entry-date">${formatDate(e.published)}</div>
          <div class="entry-title-ja">${escHtml(e.title_ja)}</div>
          <div class="entry-title-en">${escHtml(e.title_en)}</div>
          ${e.summary_ja ? `<div class="entry-summary">${escHtml(e.summary_ja)}</div>` : ''}
          <a class="entry-link" href="${escHtml(e.url)}" target="_blank" rel="noopener">
            元記事を読む →
          </a>
        </div>
      `).join('');
    }

    async function triggerCheck() {
      const btn = document.getElementById('check-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>チェック中...';

      try {
        const res = await fetch('/api/check', { method: 'POST' });
        const result = await res.json();
        if (result.success) {
          showToast(result.newCount > 0
            ? result.newCount + '件の新しい記事を翻訳しました'
            : '新しい記事はありませんでした');
          await loadTranslations();
        } else {
          showToast('エラー: ' + (result.error || '不明なエラー'));
        }
      } catch (err) {
        showToast('通信エラー: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '今すぐチェック';
      }
    }

    loadTranslations();
  </script>
</body>
</html>
